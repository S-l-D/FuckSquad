[package]
name = "tetrisapi"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-cors = "0.7"

# date and time
chrono = { version = "0.4", features = ["serde"] }

# uuid
uuid = { version = "1", features = ["v4", "serde"] }

# database
postgres = { version = "0.19.10", features = ["with-uuid-1", "with-serde_json-1", "with-chrono-0_4"] }
r2d2_postgres = "0.18.2"
r2d2 = "0.8.10"
native-tls = "0.2.14"
postgres-native-tls = "0.5"

# logger
log = "0.4.14"

# configs
dotenv = "0.15.0"
dotenv_codegen = "0.15.0"

# Serializa/Deserialize
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15.7"

common = { git = "https://gittestapi.webschool.au/Org/2119e904-e425-11e9-bb63-3fb45e5af1ec/WS/ApiLibs/Common", branch = "dev" }
entity_derive = {git = "https://gittestapi.webschool.au/Org/2119e904-e425-11e9-bb63-3fb45e5af1ec/WS/ApiLibs/Common", branch = "dev"}

tetrislib = {path="lib"}