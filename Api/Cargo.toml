[package]
name = "tetrisapi"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"

# date and time
chrono = { version = "0.4", features = ["serde"] }

# uuid
uuid = { version = "1", features = ["v4", "serde"] }

# configs
dotenv = "0.15.0"
dotenv_codegen = "0.15.0"

# Serializa/Deserialize
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
